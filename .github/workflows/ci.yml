name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  offline-tests:
    name: Packaging smoke + offline tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3 \
            python3-gi \
            gir1.2-gtk-4.0 \
            gir1.2-adw-1 \
            gettext \
            libgtk-4-1 \
            libadwaita-1-0 \
            binutils \
            zstd

      - name: Compile gettext catalogs
        run: make mo

      - name: Packaging smoke + offline unit tests
        run: make test-offline
